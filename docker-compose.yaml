services:
  postgres_database:
    image: postgres:16.0
    container_name: postgres
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_pass
      POSTGRES_DB: postgres_db
    ports:
      - '28546:5432'
    volumes:
      - postgres-storage:/var/lib/postgresql/data
    networks:
      - common

  clickhouse_database:
    image: clickhouse/clickhouse-server:24.3.6
    container_name: clickhouse-server
    ports:
      - '9000:9000'   # native binary protocol (не нужен JDBC)
      - '8123:8123'   # ✅ HTTP protocol для JDBC
    volumes:
      - warehouse_data:/var/lib/clickhouse
      - ./init_clickhouse/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' --host localhost --port 9000"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - common


  postgres_loader:
    build:
      context: .
      dockerfile: ./init_postgres/Dockerfile
    depends_on:
      - postgres_database
    environment:
      PG_HOST: postgres_database
      PG_PORT: 5432
      PG_DATABASE: postgres_db
      PG_USER: postgres_user
      PG_PASSWORD: postgres_pass
    volumes:
      - ./source_data:/source_data:ro
    networks:
      - common

  spark-master:
    build:
      context: .
      dockerfile: spark/Dockerfile
    image: custom-spark:3.5
    container_name: spark-master
    command: ["/opt/bitnami/spark/sbin/start-master.sh"]
    environment:
      - HADOOP_USER_NAME=spark
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_WEBUI_HOST=0.0.0.0
      - SPARK_JARS_IVY=/tmp/.ivy2   # директория Ivy
    ports:
      - '8080:8080'
      - '7077:7077'
    volumes:
      - ./:/app:ro
      - ./jars:/opt/jars:ro
      - spark-ivy:/tmp/.ivy2
    networks:
      - common

  spark-worker:
    build:
      context: .
      dockerfile: spark/Dockerfile
    container_name: spark-worker
    command: ["/opt/bitnami/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    environment:
      - HADOOP_USER_NAME=spark
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_NO_DAEMONIZE=yes
    depends_on:
      - spark-master
    volumes:
      - ./:/app:ro
      - ./jars:/opt/jars:ro
    networks:
      - common

  spark-job-test-connection:
    build:
      context: .
      dockerfile: spark/job/Dockerfile
    container_name: spark-job-test-connection
    depends_on:
      - postgres_loader
      - spark-master
      - spark-worker
    volumes:
      - ./jars:/opt/jars:ro
    environment:
      PG_DATABASE: postgres_db
      PG_HOST: postgres_database
      PG_PORT: 5432
      PG_USER: ${PG_USER:-postgres_user}
      PG_PASSWORD: ${PG_PASSWORD:-postgres_pass}
      
      CH_HOST: clickhouse_database
      CH_PORT: 8123
      CH_DATABASE: analytics
      CH_USER: default
      CH_PASSWORD: ""
      CH_DRIVER: com.clickhouse.jdbc.ClickHouseDriver

      SPARK_JARS: /opt/bitnami/spark/jars/clickhouse-jdbc-0.8.3-all.jar,/opt/bitnami/spark/jars/postgresql-42.7.3.jar
    healthcheck:
      test: ["CMD", "ps", "aux", "|", "grep", "spark-submit"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - common

  spark-job-populate-analytics:
    build:
      context: .
      dockerfile: spark/job/Dockerfile.populate_analytics
    container_name: spark-job-populate-analytics
    depends_on:
      spark-job-test-connection:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      clickhouse_database:
        condition: service_started
    volumes:
      - ./jars:/opt/jars:ro
    environment:
      PG_DATABASE: postgres_db
      PG_HOST: postgres_database
      PG_PORT: 5432
      PG_USER: ${PG_USER:-postgres_user}
      PG_PASSWORD: ${PG_PASSWORD:-postgres_pass}
      
      CH_HOST: clickhouse_database
      CH_PORT: 8123
      CH_DATABASE: analytics
      CH_USER: default
      CH_PASSWORD: ""
      CH_DRIVER: com.clickhouse.jdbc.ClickHouseDriver

      SPARK_JARS: /opt/bitnami/spark/jars/clickhouse-jdbc-0.8.3-all.jar,/opt/bitnami/spark/jars/postgresql-42.7.3.jar

    networks:
      - common

volumes:
  postgres-storage:
  warehouse_data:
  spark-ivy:  # Define the spark-ivy volume

networks:
  common:
    driver: bridge